name: Performance Quality Gate (k6)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  performance-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SUT API and InfluxDB
        run: docker compose up -d --build sut-api influxdb

      - name: Wait for SUT API healthcheck
        run: |
          echo "Aguardando sut-api ficar healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q "healthy"; then
              echo "sut-api está healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout aguardando sut-api"
          docker compose logs sut-api
          exit 1

      - name: Run k6 Smoke Test (Quality Gate)
        run: docker compose run --rm k6 run /scripts/smoke-test.js

      - name: Tear down environment
        if: always()
        run: docker compose down -v
